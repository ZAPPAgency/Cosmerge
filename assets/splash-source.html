<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>splash</title></head>
<body style="margin:0;background:#000;">
<canvas id="c" width="2732" height="2732"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
const S = 2732;

let g = ctx.createRadialGradient(S*0.5, S*0.42, 10, S*0.5, S*0.5, S*0.75);
g.addColorStop(0, '#1c1440');
g.addColorStop(0.55, '#0d0a1f');
g.addColorStop(1, '#05040d');
ctx.fillStyle = g;
ctx.fillRect(0, 0, S, S);

function seededRandom(seed) { let x = Math.sin(seed) * 10000; return x - Math.floor(x); }
for (let i = 0; i < 140; i++) {
  const x = seededRandom(i*1.1) * S, y = seededRandom(i*2.7+3) * S;
  const r = seededRandom(i*3.3+7) * 3 + 0.6;
  ctx.globalAlpha = seededRandom(i*4.1+1) * 0.6 + 0.2;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
}
ctx.globalAlpha = 1;

// soft glow behind the emoji
const rg = ctx.createRadialGradient(S/2, S/2, 10, S/2, S/2, S*0.22);
rg.addColorStop(0, 'rgba(139,92,246,0.35)');
rg.addColorStop(1, 'rgba(139,92,246,0)');
ctx.fillStyle = rg;
ctx.beginPath(); ctx.arc(S/2, S/2, S*0.22, 0, Math.PI*2); ctx.fill();

ctx.font = (S*0.22) + 'px -apple-system, "Apple Color Emoji", sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('✨', S/2, S/2 + S*0.01);

console.log('done');
</script>
</body></html>

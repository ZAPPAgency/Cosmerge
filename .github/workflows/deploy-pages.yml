name: Deploy Pages

# Publishes www/ to GitHub Pages on every push to main. A GitHub Actions
# workflow (rather than the legacy branch-based Pages build) is required
# here specifically because www/ is a subfolder, not the repo root or
# /docs (the only two folders the legacy build supports) - see vite.config.js,
# which needs www/ to stay exactly where it is for the Capacitor/iOS build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload www/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'www'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
